  /api/v1/accounts/complete-profile/:
    patch:
      operationId: complete_profile
      description: Updates the authenticated user's basic profile information. The
        phone number cannot be changed through this endpoint. After successful completion,
        the user can continue to the home page.
      summary: Complete User Profile
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCompleteProfileRequest'
            examples:
              ExampleRequest:
                value:
                  first_name: امیر
                  last_name: مقدم
                summary: Example Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCompleteProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCompleteProfileRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ProfileCompleted:
                  value:
                    message: اطلاعات کاربر با موفقیت تکمیل شد.
                    is_profile_completed: true
                    next: home
                    user:
                      id: 1
                      phone_number: 09196558273
                      first_name: امیر
                      last_name: مقدم
                      is_phone_verified: true
                  summary: Profile Completed
          description: User profile updated successfully.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ValidationError:
                  value:
                    first_name:
                    - این فیلد الزامی است.
                  summary: Validation Error
          description: Validation error.
        '401':
          description: Authentication credentials were not provided or are invalid.
  /api/v1/accounts/logout/:
    post:
      operationId: logout
      description: Logs out the authenticated user by blacklisting the provided refresh
        token.
      summary: Logout User
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
                  description: JWT refresh token.
              required:
              - refresh
            examples:
              ExampleRequest:
                value:
                  refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                summary: Example Request
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                LogoutSuccessful:
                  value:
                    message: Logout successful.
                  summary: Logout Successful
          description: User logged out successfully.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                MissingRefreshToken:
                  value:
                    detail: Refresh token is required.
                  summary: Missing Refresh Token
          description: Refresh token was not provided.
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                InvalidRefreshToken:
                  value:
                    detail: Refresh token is invalid or already blacklisted.
                  summary: Invalid Refresh Token
          description: Refresh token is invalid or has already been blacklisted.
  /api/v1/accounts/send-otp/:
    post:
      operationId: send_otp
      description: Sends an authentication OTP to the provided phone number. This
        endpoint is used for both existing and new users. A previously active OTP
        is invalidated before creating a new one. The OTP itself is never returned
        in the response.
      summary: Send Authentication OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
            examples:
              ExampleRequest:
                value:
                  phone_number: 09196558273
                summary: Example Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                OTPSentSuccessfully:
                  value:
                    message: کد تایید با موفقیت ارسال شد.
                    expires_in: 120
                  summary: OTP Sent Successfully
          description: OTP sent successfully.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ValidationError:
                  value:
                    phone_number:
                    - شماره تلفن همراه باید با 09 شروع شود و ۱۱ رقم باشد.
                  summary: Validation Error
          description: Validation error.
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                RateLimitExceeded:
                  value:
                    detail: تعداد درخواست‌ها بیش از حد مجاز است.
                    retry_after: 45
                  summary: Rate Limit Exceeded
          description: Too many OTP requests.
  /api/v1/accounts/token/refresh/:
    post:
      operationId: api_v1_accounts_token_refresh_create
      description: Use a valid refresh token to obtain a new access token.
      summary: Refresh JWT Access Token
      tags:
      - Authentication (Accounts Login)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/accounts/verify-otp/:
    post:
      operationId: verify_otp
      description: Verifies the OTP sent to the user's phone number. For an existing
        user, this completes authentication. For a new user, the user is created automatically
        after successful OTP verification. The response contains JWT access and refresh
        tokens and indicates whether the user needs to complete their profile.
      summary: Verify Authentication OTP
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
            examples:
              ExampleRequest:
                value:
                  phone_number: 09196558273
                  otp_code: '123456'
                summary: Example Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ExistingUser-ProfileCompleted:
                  value:
                    message: احراز هویت با موفقیت انجام شد.
                    is_new_user: false
                    is_profile_completed: true
                    next: home
                    user:
                      id: 1
                      phone_number: 09196558273
                      first_name: امیر
                      last_name: مقدم
                      is_phone_verified: true
                    tokens:
                      refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  summary: Existing User - Profile Completed
                NewUser-ProfileIncomplete:
                  value:
                    message: احراز هویت با موفقیت انجام شد.
                    is_new_user: true
                    is_profile_completed: false
                    next: complete_profile
                    user:
                      id: 2
                      phone_number: 09196558273
                      first_name: ''
                      last_name: ''
                      is_phone_verified: true
                    tokens:
                      refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  summary: New User - Profile Incomplete
          description: OTP verified successfully and JWT tokens generated.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                InvalidOTP:
                  value:
                    detail: کد تایید معتبر نیست.
                  summary: Invalid OTP
                ExpiredOTP:
                  value:
                    detail: کد تایید منقضی شده است.
                  summary: Expired OTP
                InvalidOTPCode:
                  value:
                    detail: کد تایید اشتباه است.
                    remaining_attempts: 2
                  summary: Invalid OTP Code
          description: Invalid, expired, or otherwise unusable OTP.
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                VerificationRateLimit:
                  value:
                    detail: تعداد تلاش‌های تایید بیش از حد مجاز است.
                    retry_after: 60
                  summary: Verification Rate Limit
                MaximumAttemptsExceeded:
                  value:
                    detail: تعداد تلاش‌های مجاز به پایان رسیده است.
                  summary: Maximum Attempts Exceeded
          description: OTP verification rate limit exceeded or maximum OTP attempts
            reached.
  /api/v1/articles/articles/:
    get:
      operationId: api_v1_articles_articles_list
      description: Get a list of all published articles with optional filtering
      summary: List Articles
      parameters:
      - in: query
        name: author
        schema:
          type: integer
        description: Filter by author ID
      - in: query
        name: category
        schema:
          type: string
        description: Filter by category slug
      - in: query
        name: is_featured
        schema:
          type: boolean
        description: Filter featured articles
      - in: query
        name: search
        schema:
          type: string
        description: Search in title, content, and excerpt
      tags:
      - Articles
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleList'
          description: ''
    post:
      operationId: api_v1_articles_articles_create
      description: Create a new article (requires authentication)
      summary: Create Article
      tags:
      - Articles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleCreateUpdate'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  title:
                  - This field is required.
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                example:
                  detail: Not found.
          description: ''
  /api/v1/articles/articles/{identifier}/:
    get:
      operationId: api_v1_articles_articles_retrieve
      description: Get details of a specific article by ID or slug
      summary: Get Article
      parameters:
      - in: path
        name: identifier
        schema:
          type: string
        required: true
      tags:
      - Articles
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                example:
                  detail: Not found.
          description: ''
    put:
      operationId: api_v1_articles_articles_update
      description: Update an existing article
      summary: Update Article
      parameters:
      - in: path
        name: identifier
        schema:
          type: string
        required: true
      tags:
      - Articles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  title:
                  - This field is required.
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                example:
                  detail: Not found.
          description: ''
    delete:
      operationId: api_v1_articles_articles_destroy
      description: Delete an article
      summary: Delete Article
      parameters:
      - in: path
        name: identifier
        schema:
          type: string
        required: true
      tags:
      - Articles
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                example:
                  detail: Not found.
          description: ''
