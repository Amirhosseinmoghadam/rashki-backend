                  subject: price_inquiry
                  description: سلام، لطفاً قیمت این محصول را اعلام کنید.
                summary: Price Inquiry
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactRequestCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactRequestCreateRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                ContactRequestCreatedSuccessfully:
                  value:
                    message: درخواست شما با موفقیت ثبت شد.
                    data:
                      id: 1
                  summary: Contact Request Created Successfully
          description: Contact request created successfully.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                InvalidFirstName:
                  value:
                    first_name:
                    - وارد کردن نام الزامی است.
                  summary: Invalid First Name
                InvalidLastName:
                  value:
                    last_name:
                    - وارد کردن نام خانوادگی الزامی است.
                  summary: Invalid Last Name
                InvalidPhoneNumber:
                  value:
                    phone_number:
                    - شماره تماس باید به صورت 09123456789 باشد.
                  summary: Invalid Phone Number
                InvalidSubject:
                  value:
                    subject:
                    - موضوع درخواست انتخاب‌شده معتبر نیست.
                  summary: Invalid Subject
                InvalidDescription:
                  value:
                    description:
                    - توضیحات باید حداقل ۵ کاراکتر باشد.
                  summary: Invalid Description
                DuplicateRequest:
                  value:
                    non_field_errors:
                    - این درخواست قبلاً ثبت شده است. لطفاً چند دقیقه بعد دوباره تلاش
                      کنید.
